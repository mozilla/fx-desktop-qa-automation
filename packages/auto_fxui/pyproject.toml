[project]
name = "auto-fxui"
version = "0.1.0"
description = "Reusable Firefox UI page / browser component objects"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "selenium==4.23.1",
    "pypom==2.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["auto_fxui*"]
namespaces = false

[tool.setuptools.package-data]
auto_fxui = ["data/*.components.json"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
