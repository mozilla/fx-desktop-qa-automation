[project]
name = "auto-fxui"
version = "0.1.0.dev1"
description = "Reusable Firefox UI page / browser component objects"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "faker==26.3.0",
    "jsonpath-ng==1.6.1",
    "pillow==13.0.0",
    "pyfxa==0.8.2",
    "pypom==2.2.4",
    "selenium==4.23.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "warn"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
