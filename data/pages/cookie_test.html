<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Cookie and storage test</title>
  </head>
  <body>
    <div id="cookie-status"></div>
    <script>
      const NAME = "starfox";
      const cookieSet = document.cookie
        .split("; ")
        .some((entry) => entry.startsWith(NAME + "="));
      const localSet = localStorage.getItem(NAME) !== null;
      const sessionSet = sessionStorage.getItem(NAME) !== null;
      const status = document.getElementById("cookie-status");
      if (cookieSet && localSet && sessionSet) {
        status.textContent = "Cookies already set";
      } else {
        status.textContent = "Cookies not yet set";
        document.cookie = NAME + "=1; path=/";
        document.cookie = NAME + "_session=2; path=/";
        localStorage.setItem(NAME, "1");
        sessionStorage.setItem(NAME, "1");
      }
    </script>
  </body>
</html>
