name: Add Bug to Test Links to BigQuery

on:
  workflow_dispatch:
    inputs:
      since_date:
        description: "Only bugs created on or after this date (YYYY-MM-DD)"
        required: true
        default: "2026-10-13"
        type: string

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip3 install 'uv==0.11.18';
          uv sync;

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # 3.0.0
        with:
          credentials_json: ${{ secrets.GC_CREDENTIAL_STABILITY }}

      - name: Load bug to test links into BigQuery
        env:
          SINCE_DATE: ${{ inputs.since_date }}
          TESTRAIL_BASE_URL: ${{ secrets.TESTRAIL_BASE_URL }}
          TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
          BQ_DATASET: fx_qa_ci
        run: uv run python -m scripts.bug_test_links_to_bq

      - name: Score test yield
        env:
          SINCE_DATE: ${{ inputs.since_date }}
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
          BQ_DATASET: fx_qa_ci
        run: uv run python -m scripts.test_yield_to_bq
