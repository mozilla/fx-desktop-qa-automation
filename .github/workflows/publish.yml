name: "Publish release to PyPI"

on:
  push:
    tags:
      # Publish on version tags, e.g. v0.1.0
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
      - "test-v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          python -m pip install "uv==0.13.6"

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#test-}"
          version="${version#v}"
          uv version --package auto_fxui --frozen "$version"

      - name: Build
        run: |
          uv build --package auto_fxui

      # Optional, but recommended: run smoke tests on distributions
      - name: Smoke test (wheel)
        run: |
          uv run --isolated --no-project \
            --with pytest --with dist/*.whl \
            python -m pytest \
            --confcutdir=packages/auto_fxui/tests \
            packages/auto_fxui/tests

      - name: Smoke test (source distribution)
        run: |
          uv run --isolated --no-project \
            --with pytest --with dist/*.tar.gz \
            python -m pytest \
            --confcutdir=packages/auto_fxui/tests \
            packages/auto_fxui/tests

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/


  publish-test:
    if: github.event_name == 'push' && startsWith(github.ref, "refs/tags/test")
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: test-pypi
    permissions:
      id-token: write
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          python -m pip install "uv==0.13.6"

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        run: |
          uv run --isolated --no-project \
            --with pypi-attestations \
            python -m pypi_attestations sign dist/*.whl dist/*.tar.gz

      - name: Publish
        run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          python -m pip install "uv==0.13.6"

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        run: |
          uv run --isolated --no-project \
            --with pypi-attestations \
            python -m pypi_attestations sign dist/*.whl dist/*.tar.gz

      - name: Publish
        run: uv publish --trusted-publishing always
