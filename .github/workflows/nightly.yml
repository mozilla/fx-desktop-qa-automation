---
name: Nightly Tests

run-name: Nightly smoke tests triggered by ${{ github.actor }}

# Dispatch only, that runs smoke tests every day on the morning generated nightly build
# or the functional and glean tests on the first and last day of the cycle, in addition
# to the first Thursday morning.

on:
  workflow_dispatch:
    inputs:
      win_installer_link:
        description: 'The Windows ZIP URL for the Firefox build under test'
        required: false
        type: string

      mac_installer_link:
        description: 'The macOS installer URL for the Firefox build under test'
        required: false
        type: string

      linux_tarball_link:
        description: 'The Linux tarball URL for the Firefox build under test'
        required: false
        type: string

      dry_run:
        description: 'Select smoke tests without downloading or running Firefox'
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Run:
    name: Run selected nightly tests
    uses: ./.github/workflows/core.yml
    with:
      test_sets: '["smoke"]'
      win_installer_link: ${{ inputs.win_installer_link }}
      mac_installer_link: ${{ inputs.mac_installer_link }}
      linux_tarball_link: ${{ inputs.linux_tarball_link }}
      dry_run: ${{ inputs.dry_run }}
      fx_channel: nightly
