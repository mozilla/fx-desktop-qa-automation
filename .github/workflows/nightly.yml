---
name: Daily Smoke Tests

run-name: Daily smoke tests triggered by ${{ github.actor }}

# Dispatch only. There is no schedule here on purpose: the caller decides when
# to run (cycle nights 2-13; the first and last night are covered by
# full-functional-glean.yml), either from the Actions UI or over the REST API:
#
#   curl --request POST \
#     --url "https://api.github.com/repos/mozilla/fx-desktop-qa-automation/actions/workflows/daily-smoke.yml/dispatches" \
#     --header "Accept: application/vnd.github+json" \
#     --header "Authorization: Bearer ${GITHUB_TOKEN}" \
#     --header "X-GitHub-Api-Version: 2022-11-28" \
#     --data '{
#       "ref": "main",
#       "inputs": {
#         "win_installer_link": "WINDOWS_INSTALLER_URL",
#         "mac_installer_link": "MACOS_INSTALLER_URL",
#         "linux_tarball_link": "LINUX_TARBALL_URL",
#         "dry_run": "false"
#       }
#     }'
#
on:
  workflow_dispatch:
    inputs:
      win_installer_link:
        description: Windows Firefox installer URL
        required: true
        type: string

      mac_installer_link:
        description: macOS Firefox installer URL
        required: true
        type: string

      linux_tarball_link:
        description: Linux Firefox tarball URL
        required: true
        type: string

      dry_run:
        description: Select smoke tests without downloading or running Firefox
        required: false
        default: "false"
        type: string

permissions:
  contents: read

# A daily run holds three platforms for a while. Queue an overlapping dispatch
# rather than cancelling, so a second call cannot discard a run already in
# flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MANUAL: "true"
  STARFOX_SPLIT: "smoke"
  TESTRAIL_REPORT: "false"

  # The REST API sends inputs as strings ("false"); the Actions UI sends a real
  # boolean for `type: boolean`. Expression comparison casts mismatched types to
  # number, so `inputs.dry_run == true` evaluates NaN == 1 and is always false
  # for an API-triggered run. Normalise once and compare against 'true' below.
  DRY_RUN: >-
    ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && 'true' || 'false' }}

jobs:
  test-windows:
    name: Windows - Smoke
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      FX_EXECUTABLE: C:\Program Files\Custom Firefox\firefox.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null

          python -m pip install "uv==0.11.18"

          uv sync
          uv run python scripts/switch_config.py ci
          uv sync

      - name: Check test case numbers
        shell: pwsh
        run: |
          uv run python scripts/check_test_cases.py

      - name: Select smoke tests
        id: select-smoke
        shell: pwsh
        run: |
          Remove-Item "selected_tests" -Force -ErrorAction SilentlyContinue

          uv run python -m scripts.choose_test_split

          if ($LASTEXITCODE -ne 0) {
            throw "Smoke test selection failed."
          }

          if (-not (Test-Path "selected_tests")) {
            throw "scripts.choose_test_split did not create selected_tests."
          }

          $tests = @(
            Get-Content "selected_tests" |
              Where-Object { $_.Trim() -ne "" }
          )

          if ($tests.Count -eq 0) {
            throw "No smoke tests were selected."
          }

          Write-Host "Total selected smoke test files: $($tests.Count)"
          Write-Host "Selected smoke tests:"

          $tests | ForEach-Object { Write-Host $_ }

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        shell: pwsh
        run: |
          $testCount = @(
            Get-Content "selected_tests" |
              Where-Object { $_.Trim() -ne "" }
          ).Count

          Write-Host "DRY_RUN enabled."
          Write-Host "Smoke test files selected: $testCount"
          Write-Host "Firefox download, installation and test execution skipped."

      - name: Download and install Firefox
        id: install-fx
        if: ${{ env.DRY_RUN != 'true' }}
        shell: pwsh
        env:
          WIN_INSTALLER_LINK: ${{ inputs.win_installer_link }}
        run: |
          if (-not $env:WIN_INSTALLER_LINK) {
            throw "win_installer_link is required."
          }

          $installerPath = Join-Path $env:GITHUB_WORKSPACE "setup.exe"
          $installPath = Split-Path $env:FX_EXECUTABLE -Parent

          Invoke-WebRequest -Uri $env:WIN_INSTALLER_LINK -OutFile $installerPath

          New-Item -ItemType Directory -Path $installPath -Force | Out-Null

          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/S", "/D=$installPath" `
            -Wait `
            -NoNewWindow `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Firefox installation failed with exit code $($process.ExitCode)."
          }

          if (-not (Test-Path $env:FX_EXECUTABLE)) {
            throw "Firefox executable not found at $env:FX_EXECUTABLE."
          }

          & $env:FX_EXECUTABLE --version

      - name: Download Geckodriver
        if: ${{ env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        shell: pwsh
        run: |
          $geckodriverUrl = (uv run python -m scripts.collect_executables -g) -join ""

          if (-not $geckodriverUrl) {
            throw "collect_executables returned an empty Geckodriver URL."
          }

          Invoke-WebRequest -Uri $geckodriverUrl -OutFile "geckodriver.zip"
          Expand-Archive -Path "geckodriver.zip" -DestinationPath "." -Force

          if (-not (Test-Path "geckodriver.exe")) {
            throw "geckodriver.exe was not extracted."
          }

          $env:GITHUB_WORKSPACE |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Firefox version
        id: verify
        if: ${{ env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          uv run pytest `
            ".\tests\meta\test_version.py" `
            --fx-executable="$env:FX_EXECUTABLE" `
            --geckodriver=geckodriver.exe

      - name: Run headless smoke tests
        id: smoke-headless
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          # GitHub prepends `$ErrorActionPreference = 'stop'`, and PowerShell
          # 7.4+ turns a non-zero native exit into a terminating error. Without
          # this, a failing pytest run throws here and the artifact copy below
          # never happens - losing exactly the artifacts worth keeping.
          $ErrorActionPreference = 'Continue'

          $tests = @(
            Get-Content "selected_tests" |
              Where-Object { $_.Trim() -ne "" }
          )

          uv run pytest $tests `
            --fx-executable="$env:FX_EXECUTABLE" `
            --geckodriver=geckodriver.exe

          $exitCode = $LASTEXITCODE

          New-Item -ItemType Directory -Path "test-artifacts\smoke-headless" `
            -Force | Out-Null

          if (Test-Path "artifacts") {
            Copy-Item `
              -Path "artifacts\*" `
              -Destination "test-artifacts\smoke-headless" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          exit $exitCode

      # The ci and ci_headed configs both write report.json / report.html into
      # artifacts/, so the directory has to be cleared between phases.
      - name: Reset artifacts before headed tests
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        shell: pwsh
        run: |
          Remove-Item "artifacts" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null

      - name: Run headed smoke tests
        id: smoke-headed
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          uv run python scripts/switch_config.py ci_headed
          uv sync

          $tests = @(
            Get-Content "selected_tests" |
              Where-Object { $_.Trim() -ne "" }
          )

          uv run pytest $tests `
            --fx-executable="$env:FX_EXECUTABLE" `
            --geckodriver=geckodriver.exe

          $exitCode = $LASTEXITCODE

          New-Item -ItemType Directory -Path "test-artifacts\smoke-headed" `
            -Force | Out-Null

          if (Test-Path "artifacts") {
            Copy-Item `
              -Path "artifacts\*" `
              -Destination "test-artifacts\smoke-headed" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          exit $exitCode

      - name: Upload Windows artifacts
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: daily-smoke-windows-${{ github.run_id }}
          path: test-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Set Windows job result
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        shell: pwsh
        env:
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          HEADLESS_RESULT: ${{ steps.smoke-headless.outcome }}
          HEADED_RESULT: ${{ steps.smoke-headed.outcome }}
        run: |
          Write-Host "Version check: $env:VERIFY_RESULT"
          Write-Host "Headless smoke result: $env:HEADLESS_RESULT"
          Write-Host "Headed smoke result: $env:HEADED_RESULT"

          $failures = @(
            "VERIFY_RESULT", "HEADLESS_RESULT", "HEADED_RESULT" |
              Where-Object {
                $value = [Environment]::GetEnvironmentVariable($_)
                $value -and $value -notin @("success", "skipped")
              }
          )

          if ($failures.Count -gt 0) {
            throw "Failed Windows smoke phases: $($failures -join ', ')"
          }

  test-macos:
    name: macOS - Smoke
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          mkdir -p artifacts

          python -m pip install "uv==0.11.18"

          uv sync
          uv run python scripts/switch_config.py ci
          uv sync

      - name: Check test case numbers
        run: |
          uv run python scripts/check_test_cases.py

      - name: Select smoke tests
        id: select-smoke
        run: |
          rm -f selected_tests

          uv run python -m scripts.choose_test_split

          mapfile -t tests < <(grep -vE '^[[:space:]]*$' selected_tests)

          if [[ "${#tests[@]}" -eq 0 ]]; then
            echo "::error::No smoke tests were selected."
            exit 1
          fi

          echo "Total selected smoke test files: ${#tests[@]}"
          echo "Selected smoke tests:"

          printf '  %s\n' "${tests[@]}"

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          test_count="$(grep -cve '^[[:space:]]*$' selected_tests)"

          echo "DRY_RUN enabled."
          echo "Smoke test files selected: $test_count"
          echo "Firefox download, installation and test execution skipped."

      - name: Download and install Firefox
        id: install-fx
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          MANUAL_DOWNLOAD_LINK: ${{ inputs.mac_installer_link }}
        run: |
          if [[ -z "$MANUAL_DOWNLOAD_LINK" ]]; then
            echo "::error::mac_installer_link is required."
            exit 1
          fi

          app_name="$(
            bash ./scripts/collect_executables.sh |
              xargs -0 ./scripts/parse_executables.sh
          )"

          if [[ -z "$app_name" ]]; then
            echo "::error::Unable to determine the mounted Firefox app name."
            exit 1
          fi

          fx="/Volumes/$app_name/$app_name.app/Contents/MacOS/firefox"

          if [[ ! -x "$fx" ]]; then
            echo "::error::Firefox executable not found: $fx"
            exit 1
          fi

          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "FX_EXECUTABLE=$fx" >> "$GITHUB_ENV"

          "$fx" --version

      - name: Verify Firefox version
        id: verify
        if: ${{ env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        run: |
          uv run pytest \
            --fx-executable="$FX_EXECUTABLE" \
            tests/meta/test_version.py

      - name: Run headless smoke tests
        id: smoke-headless
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        run: |
          mapfile -t tests < <(grep -vE '^[[:space:]]*$' selected_tests)

          exit_code=0

          uv run pytest \
            --fx-executable="$FX_EXECUTABLE" \
            "${tests[@]}" || exit_code=$?

          mkdir -p test-artifacts/smoke-headless

          if [[ -d artifacts ]]; then
            cp -R artifacts/. test-artifacts/smoke-headless/ || true
          fi

          exit "$exit_code"

      - name: Reset artifacts before headed tests
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        run: |
          rm -rf artifacts
          mkdir -p artifacts

      - name: Run headed smoke tests
        id: smoke-headed
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        run: |
          uv run python scripts/switch_config.py ci_headed
          uv sync

          mapfile -t tests < <(grep -vE '^[[:space:]]*$' selected_tests)

          exit_code=0

          uv run pytest \
            --fx-executable="$FX_EXECUTABLE" \
            "${tests[@]}" || exit_code=$?

          mkdir -p test-artifacts/smoke-headed

          if [[ -d artifacts ]]; then
            cp -R artifacts/. test-artifacts/smoke-headed/ || true
          fi

          exit "$exit_code"

      - name: Upload macOS artifacts
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: daily-smoke-macos-${{ github.run_id }}
          path: test-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Set macOS job result
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        env:
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          HEADLESS_RESULT: ${{ steps.smoke-headless.outcome }}
          HEADED_RESULT: ${{ steps.smoke-headed.outcome }}
        run: |
          echo "Version check: $VERIFY_RESULT"
          echo "Headless smoke result: $HEADLESS_RESULT"
          echo "Headed smoke result: $HEADED_RESULT"

          failures=()

          for phase in VERIFY_RESULT HEADLESS_RESULT HEADED_RESULT; do
            value="${!phase}"
            if [[ -n "$value" && "$value" != "success" && "$value" != "skipped" ]]; then
              failures+=("$phase")
            fi
          done

          if [[ "${#failures[@]}" -gt 0 ]]; then
            echo "::error::Failed macOS smoke phases: ${failures[*]}"
            exit 1
          fi

  test-linux:
    name: Linux - Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FX_EXECUTABLE: ./firefox/firefox
      # Kept outside artifacts/, which is wiped between phases.
      XVFB_LOG: /tmp/xvfb.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install --yes gnome-screenshot xvfb

      - name: Install Python dependencies
        run: |
          mkdir -p artifacts

          python -m pip install "uv==0.11.18"

          uv sync
          uv run python scripts/switch_config.py ci_xvfb
          uv sync

      - name: Check test case numbers
        run: |
          uv run python scripts/check_test_cases.py

      - name: Select smoke tests
        id: select-smoke
        run: |
          rm -f selected_tests

          uv run python -m scripts.choose_test_split

          mapfile -t tests < <(grep -vE '^[[:space:]]*$' selected_tests)

          if [[ "${#tests[@]}" -eq 0 ]]; then
            echo "::error::No smoke tests were selected."
            exit 1
          fi

          echo "Total selected smoke test files: ${#tests[@]}"
          echo "Selected smoke tests:"

          printf '  %s\n' "${tests[@]}"

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          test_count="$(grep -cve '^[[:space:]]*$' selected_tests)"

          echo "DRY_RUN enabled."
          echo "Smoke test files selected: $test_count"
          echo "Firefox download, installation and test execution skipped."

      - name: Download and install Firefox
        id: install-fx
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          MANUAL_DOWNLOAD_LINK: ${{ inputs.linux_tarball_link }}
        run: |
          if [[ -z "$MANUAL_DOWNLOAD_LINK" ]]; then
            echo "::error::linux_tarball_link is required."
            exit 1
          fi

          ./scripts/collect_executables.sh

          if [[ ! -x "$FX_EXECUTABLE" ]]; then
            echo "::error::Firefox executable not found at $FX_EXECUTABLE."
            exit 1
          fi

          "$FX_EXECUTABLE" --version

      - name: Start Xvfb
        id: xvfb
        if: ${{ env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        run: |
          Xvfb :99 -screen 0 1600x1200x24 > "$XVFB_LOG" 2>&1 &
          xvfb_pid=$!

          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "XVFB_PID=$xvfb_pid" >> "$GITHUB_ENV"

          sleep 2

          if ! kill -0 "$xvfb_pid" 2>/dev/null; then
            echo "::error::Xvfb did not start successfully."
            cat "$XVFB_LOG"
            exit 1
          fi

      - name: Verify Firefox version
        id: verify
        if: ${{ env.DRY_RUN != 'true' && steps.xvfb.outcome == 'success' }}
        continue-on-error: true
        run: |
          uv run pytest \
            --fx-executable="$FX_EXECUTABLE" \
            tests/meta/test_version.py

      - name: Run headless smoke tests
        id: smoke-headless
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.xvfb.outcome == 'success' }}
        continue-on-error: true
        run: |
          mapfile -t tests < <(grep -vE '^[[:space:]]*$' selected_tests)

          exit_code=0

          uv run pytest \
            --fx-executable="$FX_EXECUTABLE" \
            "${tests[@]}" || exit_code=$?

          mkdir -p test-artifacts/smoke-headless

          if [[ -d artifacts ]]; then
            cp -R artifacts/. test-artifacts/smoke-headless/ || true
          fi

          exit "$exit_code"

      - name: Reset artifacts before headed tests
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        run: |
          rm -rf artifacts
          mkdir -p artifacts

      - name: Run headed smoke tests
        id: smoke-headed
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.xvfb.outcome == 'success' }}
        continue-on-error: true
        run: |
          uv run python scripts/switch_config.py ci_xvfb_headed
          uv sync

          mapfile -t tests < <(grep -vE '^[[:space:]]*$' selected_tests)

          exit_code=0

          uv run pytest \
            --fx-executable="$FX_EXECUTABLE" \
            "${tests[@]}" || exit_code=$?

          mkdir -p test-artifacts/smoke-headed

          if [[ -d artifacts ]]; then
            cp -R artifacts/. test-artifacts/smoke-headed/ || true
          fi

          exit "$exit_code"

      - name: Stop Xvfb and collect its log
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        run: |
          if [[ -n "${XVFB_PID:-}" ]]; then
            kill "$XVFB_PID" 2>/dev/null || true
          fi

          mkdir -p test-artifacts

          if [[ -f "$XVFB_LOG" ]]; then
            cp "$XVFB_LOG" test-artifacts/ || true
          fi

      - name: Upload Linux artifacts
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: daily-smoke-linux-${{ github.run_id }}
          path: test-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Set Linux job result
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        env:
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          HEADLESS_RESULT: ${{ steps.smoke-headless.outcome }}
          HEADED_RESULT: ${{ steps.smoke-headed.outcome }}
        run: |
          echo "Version check: $VERIFY_RESULT"
          echo "Headless smoke result: $HEADLESS_RESULT"
          echo "Headed smoke result: $HEADED_RESULT"

          failures=()

          for phase in VERIFY_RESULT HEADLESS_RESULT HEADED_RESULT; do
            value="${!phase}"
            if [[ -n "$value" && "$value" != "success" && "$value" != "skipped" ]]; then
              failures+=("$phase")
            fi
          done

          if [[ "${#failures[@]}" -gt 0 ]]; then
            echo "::error::Failed Linux smoke phases: ${failures[*]}"
            exit 1
          fi
