name: Promote Firefox train branches

on:
  repository_dispatch:
    types: [firefox-beta-promoted]
  workflow_dispatch:
    inputs:
      released_major:
        description: Major version currently on main (for example, 155)
        required: true
        type: string
      retention:
        description: Number of release branches to keep
        default: 2
        required: true
        type: number
      dry_run:
        description: Show the planned changes without updating branches
        default: true
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: firefox-train-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.ref == 'refs/heads/main' ||
      inputs.dry_run
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      API_RELEASED_MAJOR: ${{ github.event.client_payload.released_major }}
      API_RETENTION: ${{ github.event.client_payload.retention }}
      MANUAL_RELEASED_MAJOR: ${{ inputs.released_major }}
      MANUAL_RETENTION: ${{ inputs.retention }}
      MANUAL_DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Rotate Firefox train branches
        id: rotate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            released_major="$API_RELEASED_MAJOR"
            retention="${API_RETENTION:-2}"
            dry_run=false
          else
            released_major="$MANUAL_RELEASED_MAJOR"
            retention="$MANUAL_RETENTION"
            dry_run="$MANUAL_DRY_RUN"
          fi

          if [[ ! "$released_major" =~ ^[1-9][0-9]*$ ]]; then
            echo "released_major must be a positive integer." >&2
            exit 1
          fi
          if [[ ! "$retention" =~ ^[1-9][0-9]*$ ]]; then
            echo "retention must be a positive integer." >&2
            exit 1
          fi
          if [[ "$dry_run" != "true" && "$dry_run" != "false" ]]; then
            echo "dry_run must be true or false." >&2
            exit 1
          fi

          release_branch="release${released_major}"
          for required_branch in main nightly; do
            if ! git ls-remote --exit-code --heads origin \
              "refs/heads/$required_branch" > /dev/null; then
              echo "Required branch '$required_branch' does not exist on origin." >&2
              exit 1
            fi
          done

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/nightly:refs/remotes/origin/nightly'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          nightly_sha="$(git rev-parse refs/remotes/origin/nightly)"
          release_sha="$(git ls-remote --heads origin "refs/heads/$release_branch" | awk '{print $1}')"

          mapfile -t release_majors < <(
            {
              git ls-remote --heads origin 'refs/heads/release*'
              echo "planned refs/heads/$release_branch"
            } |
              awk '$2 ~ /^refs\/heads\/release[0-9]+$/ {
                sub("refs/heads/release", "", $2)
                print $2
              }' |
              sort -nru
          )

          old_branches=()
          for ((index = retention; index < ${#release_majors[@]}; index++)); do
            old_branches+=("release${release_majors[$index]}")
          done

          if [[ -n "$release_sha" ]]; then
            action="already-promoted"
            push_args=()
            echo "$release_branch already exists; skipping promotion."
          else
            action="promote"
            push_args=(
              "$main_sha:refs/heads/$release_branch"
              "$nightly_sha:refs/heads/main"
            )
          fi

          # Retention cleanup also runs after a repeated promotion event.
          for branch in "${old_branches[@]}"; do
            push_args+=(":refs/heads/$branch")
          done

          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "release_branch=$release_branch" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "nightly_sha=$nightly_sha" >> "$GITHUB_OUTPUT"

          echo "Action: $action"
          echo "Archive main as: $release_branch"
          echo "Promote nightly SHA to main: $nightly_sha"
          echo "Release branches to delete: ${old_branches[*]:-none}"

          if [[ "$dry_run" == "true" ]]; then
            echo "Dry run: no branches were changed."
            exit 0
          fi

          if ((${#push_args[@]} == 0)); then
            echo "Nothing to change."
            exit 0
          fi

          push_options=(--atomic)
          if [[ "$action" == "promote" ]]; then
            # The lease prevents overwriting a main update made after discovery.
            push_options+=("--force-with-lease=refs/heads/main:$main_sha")
          fi
          git push "${push_options[@]}" origin "${push_args[@]}"

      - name: Write summary
        shell: bash
        run: |
          {
            echo "### Firefox train promotion"
            echo
            echo "- Result: \`${{ steps.rotate.outputs.action }}\`"
            echo "- Archived branch: \`${{ steps.rotate.outputs.release_branch }}\`"
            echo "- Previous main: \`${{ steps.rotate.outputs.main_sha }}\`"
            echo "- Nightly promoted to main: \`${{ steps.rotate.outputs.nightly_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
