name: Promote Firefox train branches

on:
  schedule:
    - cron: "17 23 * * 2"
  workflow_dispatch:
    inputs:
      released_major:
        description: Major version on main; defaults to the current Firefox release
        required: false
        type: string
      retention:
        description: Number of release branches to keep
        default: 2
        required: false
        type: number
      dry_run:
        description: Show the planned changes without updating branches
        default: true
        required: false
        type: boolean

permissions: {}

concurrency:
  group: firefox-train-promotion
  cancel-in-progress: false

jobs:
  approve_live:
    name: Approve live Firefox train promotion
    # Scheduled runs skip approval; the script's version checks guard them.
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
    runs-on: ubuntu-latest
    # Configure this environment with required reviewers before live use.
    environment:
      name: firefox-branch-promotion
    steps:
      - name: Confirm approval
        run: echo "Live Firefox train promotion approved."

  promote:
    name: Plan or promote Firefox train branches
    needs: approve_live
    if: >-
      always() &&
      contains(fromJSON('["success", "skipped"]'), needs.approve_live.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # List PRs that will be affected by moving main.

    steps:
      - name: Validate promotion source
        if: >-
          github.ref != 'refs/heads/main' &&
          inputs.dry_run != true
        shell: bash
        run: |
          echo "::error::Live promotions must run from main. Select main or enable dry_run."
          exit 1

      - name: Create DTE push bot token
        id: app-token
        if: inputs.dry_run != true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write

      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Git authentication
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Plan or promote Firefox train branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASED_MAJOR: ${{ inputs.released_major }}
          RETENTION: ${{ inputs.retention }}
          FIRST_RELEASE_VERSION: ${{ vars.FIRST_RELEASE_VERSION }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: python3 scripts/sync_firefox_branches.py
