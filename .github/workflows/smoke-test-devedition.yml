name: Check new devedition version

on:
  schedule:
    - cron: "35 */1 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-Run - If true, only report the plan; do not trigger downstream workflows."
        required: false
        default: "false"

env:
  LATEST: ""
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

permissions:
  contents: read

jobs:
  Resolve-Firefox:
    uses: ./.github/workflows/resolve-firefox-branch.yml
    with:
      channel: devedition

  Check-DevEdition-Version:
    needs: Resolve-Firefox
    runs-on: ubuntu-latest
    outputs:
      win_reportable: ${{ steps.reportable.outputs.win }}
      mac_reportable: ${{ steps.reportable.outputs.mac }}
      preview_json: ${{ steps.reportable.outputs.preview_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ needs.Resolve-Firefox.outputs.automation_ref }}
          persist-credentials: false

      - name: Setup dependencies
        run: bash ./scripts/setup_python.sh

      - name: Check if the run is reportable
        id: reportable
        env:
          FX_CHANNEL: "devedition"
          STARFOX_SPLIT: smoke
          TESTRAIL_REPORT: true
          TESTRAIL_BASE_URL: ${{ secrets.TESTRAIL_BASE_URL }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
          FX_VERSION: ${{ needs.Resolve-Firefox.outputs.firefox_version }}
          DRY_RUN: ${{ env.DRY_RUN }}
        run:
          bash ./scripts/check_reportable.sh

  Run-Win-Smoke:
    needs:
      - Resolve-Firefox
      - Check-DevEdition-Version
    if: |-
      ${{
        needs.Check-DevEdition-Version.outputs.win_reportable == 'True' &&
        !( github.event.inputs.preview_only == 'true' )
       }}
    uses: ./.github/workflows/main.yml
    with:
      automation_ref: ${{ needs.Resolve-Firefox.outputs.automation_ref }}
      firefox_version: ${{ needs.Resolve-Firefox.outputs.firefox_version }}
      windows_download_url: ${{ needs.Resolve-Firefox.outputs.windows_download_url }}
      macos_download_url: ${{ needs.Resolve-Firefox.outputs.macos_download_url }}
      linux_download_url: ${{ needs.Resolve-Firefox.outputs.linux_download_url }}
      channel: "devedition"
      job_to_run: Test-Windows
      test_set: smoke
    secrets: inherit

  Run-Mac-Smoke:
    needs:
      - Resolve-Firefox
      - Check-DevEdition-Version
    if: |-
      ${{
        needs.Check-DevEdition-Version.outputs.mac_reportable == 'True' &&
        !( github.event.inputs.preview_only == 'true' )
       }}
    uses: ./.github/workflows/main.yml
    with:
      automation_ref: ${{ needs.Resolve-Firefox.outputs.automation_ref }}
      firefox_version: ${{ needs.Resolve-Firefox.outputs.firefox_version }}
      windows_download_url: ${{ needs.Resolve-Firefox.outputs.windows_download_url }}
      macos_download_url: ${{ needs.Resolve-Firefox.outputs.macos_download_url }}
      linux_download_url: ${{ needs.Resolve-Firefox.outputs.linux_download_url }}
      channel: "devedition"
      job_to_run: Test-MacOS
      test_set: smoke
    secrets: inherit
