name: Run Firefox candidate tests

on:
  workflow_dispatch:
    inputs:
      firefox_version:
        description: Firefox candidate version (for example, 155.0.1 or 153.0esr)
        required: true
        type: string
      test_set:
        description: Test set to run
        default: smoke
        required: false
        type: string

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve candidate and dispatch tests
        env:
          FIREFOX_VERSION: ${{ inputs.firefox_version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TEST_SET: ${{ inputs.test_set }}
        shell: bash
        run: |
          set -euo pipefail

          candidate_root="https://archive.mozilla.org/pub/firefox/candidates/${FIREFOX_VERSION}-candidates"
          listing="$(curl --fail --location --silent --show-error "$candidate_root/")"
          build="$(
            grep -oE '/build[1-9][0-9]*/' <<< "$listing" |
              grep -oE '[1-9][0-9]*' |
              sort -n |
              tail -1 || true
          )"

          if [[ -z "$build" ]]; then
            echo "No candidate builds found for Firefox $FIREFOX_VERSION" >&2
            exit 1
          fi

          base_url="$candidate_root/build$build"
          win_url="$base_url/win64/en-US/Firefox%20Setup%20${FIREFOX_VERSION}.exe"
          mac_url="$base_url/mac/en-US/Firefox%20${FIREFOX_VERSION}.dmg"
          linux_url="$base_url/linux-x86_64/en-US/firefox-${FIREFOX_VERSION}.tar.xz"

          for url in "$win_url" "$mac_url" "$linux_url"; do
            curl --fail --location --silent --show-error --head "$url" > /dev/null
          done

          echo "Resolved Firefox $FIREFOX_VERSION build$build"
          gh workflow run main.yml \
            --ref "$GITHUB_REF_NAME" \
            --field win_installer_link="$win_url" \
            --field mac_installer_link="$mac_url" \
            --field linux_tarball_link="$linux_url" \
            --field test_set="$TEST_SET"
