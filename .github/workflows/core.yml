---
name: Fx Test Core

on:
  workflow_call:
    inputs:
      test_sets:
        description: "Test set to run"
        required: false
        default: ""
        type: string

      win_installer_link:
        description: 'The link to the Windows installer (win64) for the Fx under test'
        required: false
        type: string

      mac_installer_link:
        description: 'The link to the macOS installer for the Fx under test'
        required: false
        type: string

      linux_tarball_link:
        description: 'The link to the Linux tarball (linux-x86_64) for the Fx under test'
        required: false
        type: string

      dry_run:
        description: "If true, skip downloads/installs/tests/uploads (safe dry run)"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

env:
  MANUAL: "true"
  TESTRAIL_REPORT: "false"
  DRY_RUN: ${{ inputs.dry_run == 'true' && 'true' || 'false' }}

jobs:
  Preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      test_sets: ${{ steps.sets.outputs.test_sets }}
      run_windows: ${{ steps.platforms.outputs.windows }}
      run_macos: ${{ steps.platforms.outputs.macos }}
      run_linux: ${{ steps.platforms.outputs.linux }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.18"
          uv sync

      - name: Check test case numbers
        run: |
          uv run python scripts/check_test_cases.py

      - name: Resolve which platforms to run
        id: platforms
        env:
          WIN_LINK: ${{ inputs.win_installer_link }}
          MAC_LINK: ${{ inputs.mac_installer_link }}
          LINUX_LINK: ${{ inputs.linux_tarball_link }}
        run: |
          windows=false
          macos=false
          linux=false

          if [[ -n "$WIN_LINK" ]]; then windows=true; fi
          if [[ -n "$MAC_LINK" ]]; then macos=true; fi
          if [[ -n "$LINUX_LINK" ]]; then linux=true; fi

          if [[ "$windows" == "false" &&
                "$macos" == "false" &&
                "$linux" == "false" ]]; then
            echo "::error::No installer links supplied. Provide at least one of" \
                 "win_installer_link, mac_installer_link or linux_tarball_link."
            exit 1
          fi

          {
            echo "windows=$windows"
            echo "macos=$macos"
            echo "linux=$linux"
          } >> "$GITHUB_OUTPUT"

      - name: Build the test-set matrix
        id: sets
        env:
          TEST_SETS: ${{ inputs.test_sets }}
        run: |
          if [[ -n "$TEST_SETS" ]]; then
            if ! jq -e 'type == "array" and length > 0' <<<"$TEST_SETS" \
                 > /dev/null 2>&1; then
              echo "::error::test_sets must be a non-empty JSON array," \
                   "got: $TEST_SETS"
              exit 1
            fi

            echo "test_sets=$(jq -c . <<<"$TEST_SETS")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          manifest_path="manifests/key.yaml"

          if [[ ! -f "$manifest_path" ]]; then
            echo "::error::Manifest file not found: $manifest_path"
            exit 1
          fi

          splits="$(
            grep -oE 'functional[0-9]+' "$manifest_path" | sort -Vu
          )"

          if [[ -z "$splits" ]]; then
            echo "::error::No functional splits found in $manifest_path."
            exit 1
          fi

          test_sets="$(
            printf '%s\n' "$splits" glean | jq -Rc . | jq -sc .
          )"

          echo "test_sets=$test_sets" >> "$GITHUB_OUTPUT"

      - name: Summarise the plan
        env:
          TEST_SETS: ${{ steps.sets.outputs.test_sets }}
          WINDOWS: ${{ steps.platforms.outputs.windows }}
          MACOS: ${{ steps.platforms.outputs.macos }}
          LINUX: ${{ steps.platforms.outputs.linux }}
        run: |
          {
            echo "### Run plan"
            echo
            echo "| setting | value |"
            echo "|---|---|"
            echo "| dry run | \`$DRY_RUN\` |"
            echo "| test sets | \`$TEST_SETS\` |"
            echo "| Windows | \`$WINDOWS\` |"
            echo "| macOS | \`$MACOS\` |"
            echo "| Linux | \`$LINUX\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  Test-Windows:
    name: Windows (${{ matrix.test_set }})
    needs: Preflight
    if: ${{ needs.Preflight.outputs.run_windows == 'true' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        test_set: ${{ fromJSON(needs.Preflight.outputs.test_sets) }}
    env:
      STARFOX_SPLIT: ${{ matrix.test_set }}
      FX_EXECUTABLE: C:\Program Files\Custom Firefox\firefox.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null

          python -m pip install "uv==0.11.18"

          uv sync
          uv run python scripts/switch_config.py ci
          uv sync

      - name: Select tests
        id: select
        shell: pwsh
        run: |
          if ($env:STARFOX_SPLIT -eq "glean") {
            "tests/glean" |
              Set-Content -Path "selected_tests" -Encoding utf8
          }
          else {
            uv run python -m scripts.choose_test_split

            if ($LASTEXITCODE -ne 0) {
              throw "Test selection failed for $env:STARFOX_SPLIT."
            }
          }

          $tests = @(
            Get-Content "selected_tests" |
              Where-Object { $_.Trim() -ne "" }
          )

          if ($tests.Count -eq 0) {
            throw "No tests were selected for $env:STARFOX_SPLIT."
          }

          Write-Host "Selected $($tests.Count) test files:"
          $tests | ForEach-Object { Write-Host "  $_" }

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        shell: pwsh
        run: |
          $count = @(
            Get-Content "selected_tests" |
              Where-Object { $_.Trim() -ne "" }
          ).Count

          Write-Host "DRY_RUN enabled."
          Write-Host "Test set: $env:STARFOX_SPLIT"
          Write-Host "Test files selected: $count"
          Write-Host "Firefox download, installation and execution skipped."

      - name: Download and install Firefox
        id: install-fx
        if: ${{ env.DRY_RUN != 'true' }}
        shell: pwsh
        env:
          WIN_INSTALLER_LINK: ${{ inputs.win_installer_link }}
        run: |
          $installerPath = Join-Path $env:GITHUB_WORKSPACE "setup.exe"
          $installPath = Split-Path $env:FX_EXECUTABLE -Parent

          Invoke-WebRequest -Uri $env:WIN_INSTALLER_LINK -OutFile $installerPath

          New-Item -ItemType Directory -Path $installPath -Force | Out-Null

          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/S", "/D=$installPath" `
            -Wait `
            -NoNewWindow `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Firefox installation failed with exit code $($process.ExitCode)."
          }

          if (-not (Test-Path $env:FX_EXECUTABLE)) {
            throw "Firefox executable not found at $env:FX_EXECUTABLE."
          }

          & $env:FX_EXECUTABLE --version

      - name: Download Geckodriver
        id: download-geckodriver
        if: ${{ env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        shell: pwsh
        run: |
          $geckodriverUrl = (uv run python -m scripts.collect_executables -g) -join ""

          if (-not $geckodriverUrl) {
            throw "collect_executables returned an empty Geckodriver URL."
          }

          Invoke-WebRequest -Uri $geckodriverUrl -OutFile "geckodriver.zip"
          Expand-Archive -Path "geckodriver.zip" -DestinationPath "." -Force

          if (-not (Test-Path "geckodriver.exe")) {
            throw "geckodriver.exe was not extracted."
          }

          $env:GITHUB_WORKSPACE |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Firefox version
        id: verify
        if: ${{ env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          uv run pytest `
            ".\tests\meta\test_version.py" `
            --fx-executable="$env:FX_EXECUTABLE" `
            --geckodriver=geckodriver.exe

      - name: Run headless tests
        id: headless
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.download-geckodriver.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $tests = @(
            Get-Content "selected_tests" |
              Where-Object { $_.Trim() -ne "" }
          )

          uv run pytest $tests `
            --fx-executable="$env:FX_EXECUTABLE" `
            --geckodriver=geckodriver.exe

          $exitCode = $LASTEXITCODE

          New-Item -ItemType Directory -Path "test-artifacts\headless" -Force |
            Out-Null

          if (Test-Path "artifacts") {
            Copy-Item `
              -Path "artifacts\*" `
              -Destination "test-artifacts\headless" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          exit $exitCode

      - name: Reset artifacts before headed tests
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && matrix.test_set != 'glean' }}
        shell: pwsh
        run: |
          Remove-Item "artifacts" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null

      - name: Run headed tests
        id: headed
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && matrix.test_set != 'glean' && steps.download-geckodriver.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          uv run python scripts/switch_config.py ci_headed
          uv sync

          $tests = @(
            Get-Content "selected_tests" |
              Where-Object { $_.Trim() -ne "" }
          )

          uv run pytest $tests `
            --fx-executable="$env:FX_EXECUTABLE" `
            --geckodriver=geckodriver.exe

          $exitCode = $LASTEXITCODE

          New-Item -ItemType Directory -Path "test-artifacts\headed" -Force |
            Out-Null

          if (Test-Path "artifacts") {
            Copy-Item `
              -Path "artifacts\*" `
              -Destination "test-artifacts\headed" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          exit $exitCode

      - name: Upload Windows artifacts
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: windows-${{ matrix.test_set }}-${{ github.run_id }}
          path: test-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Set Windows job result
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        shell: pwsh
        env:
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          HEADLESS_RESULT: ${{ steps.headless.outcome }}
          HEADED_RESULT: ${{ steps.headed.outcome }}
        run: |
          Write-Host "Version check: $env:VERIFY_RESULT"
          Write-Host "Headless: $env:HEADLESS_RESULT"
          Write-Host "Headed: $env:HEADED_RESULT"

          $failures = @(
            "VERIFY_RESULT", "HEADLESS_RESULT", "HEADED_RESULT" |
              Where-Object {
                $value = [Environment]::GetEnvironmentVariable($_)
                $value -and $value -notin @("success", "skipped")
              }
          )

          if ($failures.Count -gt 0) {
            throw "Failed phases on $($env:STARFOX_SPLIT): $($failures -join ', ')"
          }

  Test-MacOS:
    name: macOS (${{ matrix.test_set }})
    needs: Preflight
    if: ${{ needs.Preflight.outputs.run_macos == 'true' }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        test_set: ${{ fromJSON(needs.Preflight.outputs.test_sets) }}
    env:
      STARFOX_SPLIT: ${{ matrix.test_set }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          mkdir -p artifacts

          python -m pip install "uv==0.11.18"

          uv sync
          uv run python scripts/switch_config.py ci
          uv sync

      - name: Select tests
        id: select
        run: |
          if [[ "$STARFOX_SPLIT" == "glean" ]]; then
            echo "tests/glean" > selected_tests
          else
            uv run python -m scripts.choose_test_split
          fi

          tests=()
          while IFS= read -r line; do
            tests+=("$line")
          done < <(grep -vE '^[[:space:]]*$' selected_tests)

          if [[ "${#tests[@]}" -eq 0 ]]; then
            echo "::error::No tests were selected for $STARFOX_SPLIT."
            exit 1
          fi

          echo "Selected ${#tests[@]} test files:"
          printf '  %s\n' "${tests[@]}"

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          count="$(grep -cve '^[[:space:]]*$' selected_tests || true)"

          echo "DRY_RUN enabled."
          echo "Test set: $STARFOX_SPLIT"
          echo "Test files selected: $count"
          echo "Firefox download, installation and execution skipped."

      - name: Download and install Firefox
        id: install-fx
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          MANUAL_DOWNLOAD_LINK: ${{ inputs.mac_installer_link }}
        run: |
          app_name="$(
            bash ./scripts/collect_executables.sh |
              xargs -0 ./scripts/parse_executables.sh
          )"

          if [[ -z "$app_name" ]]; then
            echo "::error::Unable to determine the mounted Firefox app name."
            exit 1
          fi

          fx="/Volumes/$app_name/$app_name.app/Contents/MacOS/firefox"

          if [[ ! -x "$fx" ]]; then
            echo "::error::Firefox executable not found: $fx"
            exit 1
          fi

          echo "FX_EXECUTABLE=$fx" >> "$GITHUB_ENV"

          "$fx" --version

      - name: Verify Firefox version
        id: verify
        if: ${{ env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        run: |
          uv run pytest \
            --fx-executable="$FX_EXECUTABLE" \
            tests/meta/test_version.py

      - name: Run headless tests
        id: headless
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        run: |
          tests=()
          while IFS= read -r line; do
            tests+=("$line")
          done < <(grep -vE '^[[:space:]]*$' selected_tests)

          exit_code=0

          uv run pytest \
            --fx-executable="$FX_EXECUTABLE" \
            "${tests[@]}" || exit_code=$?

          mkdir -p test-artifacts/headless

          if [[ -d artifacts ]]; then
            cp -R artifacts/. test-artifacts/headless/ || true
          fi

          exit "$exit_code"

      - name: Reset artifacts before headed tests
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && matrix.test_set != 'glean' }}
        run: |
          rm -rf artifacts
          mkdir -p artifacts

      - name: Run headed tests
        id: headed
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && matrix.test_set != 'glean' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        run: |
          uv run python scripts/switch_config.py ci_headed
          uv sync

          tests=()
          while IFS= read -r line; do
            tests+=("$line")
          done < <(grep -vE '^[[:space:]]*$' selected_tests)

          exit_code=0

          uv run pytest \
            --fx-executable="$FX_EXECUTABLE" \
            "${tests[@]}" || exit_code=$?

          mkdir -p test-artifacts/headed

          if [[ -d artifacts ]]; then
            cp -R artifacts/. test-artifacts/headed/ || true
          fi

          exit "$exit_code"

      - name: Upload macOS artifacts
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: macos-${{ matrix.test_set }}-${{ github.run_id }}
          path: test-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Set macOS job result
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        env:
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          HEADLESS_RESULT: ${{ steps.headless.outcome }}
          HEADED_RESULT: ${{ steps.headed.outcome }}
        run: |
          echo "Version check: $VERIFY_RESULT"
          echo "Headless: $HEADLESS_RESULT"
          echo "Headed: $HEADED_RESULT"

          failures=()

          for phase in VERIFY_RESULT HEADLESS_RESULT HEADED_RESULT; do
            value="${!phase}"
            # 'skipped' is expected for the headed phase on the Glean entry.
            if [[ -n "$value" && "$value" != "success" && "$value" != "skipped" ]]; then
              failures+=("$phase")
            fi
          done

          if [[ "${#failures[@]}" -gt 0 ]]; then
            echo "::error::Failed phases on $STARFOX_SPLIT: ${failures[*]}"
            exit 1
          fi

  Test-Linux:
    name: Linux (${{ matrix.test_set }})
    needs: Preflight
    if: ${{ needs.Preflight.outputs.run_linux == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_set: ${{ fromJSON(needs.Preflight.outputs.test_sets) }}
    env:
      STARFOX_SPLIT: ${{ matrix.test_set }}
      FX_EXECUTABLE: ./firefox/firefox
      # Kept outside artifacts/, which is wiped between phases.
      XVFB_LOG_DIR: /tmp/xvfb

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-screenshot xvfb

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          mkdir -p artifacts "$XVFB_LOG_DIR"

          python -m pip install "uv==0.11.18"

          uv sync
          uv run python scripts/switch_config.py ci_xvfb
          uv sync

      - name: Select tests
        id: select
        env:
          # The no_xvfb split holds tests that cannot run under Xvfb. They are
          # not marked with @pytest.mark.noxvfb, so the config's -m filter does
          # not catch them; excluding them here is the only thing that does.
          STARFOX_EXCLUDE: no_xvfb
        run: |
          if [[ "$STARFOX_SPLIT" == "glean" ]]; then
            echo "tests/glean" > selected_tests
          else
            uv run python -m scripts.choose_test_split
          fi

          tests=()
          while IFS= read -r line; do
            tests+=("$line")
          done < <(grep -vE '^[[:space:]]*$' selected_tests)

          if [[ "${#tests[@]}" -eq 0 ]]; then
            echo "::error::No tests were selected for $STARFOX_SPLIT."
            exit 1
          fi

          echo "Selected ${#tests[@]} test files:"
          printf '  %s\n' "${tests[@]}"

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          count="$(grep -cve '^[[:space:]]*$' selected_tests || true)"

          echo "DRY_RUN enabled."
          echo "Test set: $STARFOX_SPLIT"
          echo "Test files selected: $count"
          echo "Firefox download, installation and execution skipped."

      - name: Download and install Firefox
        id: install-fx
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          MANUAL_DOWNLOAD_LINK: ${{ inputs.linux_tarball_link }}
        run: |
          ./scripts/collect_executables.sh

          if [[ ! -x "$FX_EXECUTABLE" ]]; then
            echo "::error::Firefox executable not found at $FX_EXECUTABLE."
            exit 1
          fi

          "$FX_EXECUTABLE" --version

      - name: Verify Firefox version
        id: verify
        if: ${{ env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        run: |
          xvfb-run -a -e "$XVFB_LOG_DIR/verify.log" -f "$HOME/.Xauthority" \
            -s "-screen 0 1600x1200x24" \
            uv run pytest \
              --fx-executable="$FX_EXECUTABLE" \
              --geckodriver=geckodriver \
              tests/meta/test_version.py

      - name: Run headless tests
        id: headless
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        run: |
          tests=()
          while IFS= read -r line; do
            tests+=("$line")
          done < <(grep -vE '^[[:space:]]*$' selected_tests)

          exit_code=0

          xvfb-run -a -e "$XVFB_LOG_DIR/headless.log" -f "$HOME/.Xauthority" \
            -s "-screen 0 1600x1200x24" \
            uv run pytest \
              --fx-executable="$FX_EXECUTABLE" \
              --geckodriver=geckodriver \
              "${tests[@]}" || exit_code=$?

          mkdir -p test-artifacts/headless

          if [[ -d artifacts ]]; then
            cp -R artifacts/. test-artifacts/headless/ || true
          fi

          exit "$exit_code"

      - name: Reset artifacts before headed tests
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && matrix.test_set != 'glean' }}
        run: |
          rm -rf artifacts
          mkdir -p artifacts

      - name: Run headed tests
        id: headed
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && matrix.test_set != 'glean' && steps.install-fx.outcome == 'success' }}
        continue-on-error: true
        run: |
          uv run python scripts/switch_config.py ci_xvfb_headed
          uv sync

          tests=()
          while IFS= read -r line; do
            tests+=("$line")
          done < <(grep -vE '^[[:space:]]*$' selected_tests)

          exit_code=0

          xvfb-run -a -e "$XVFB_LOG_DIR/headed.log" -f "$HOME/.Xauthority" \
            -s "-screen 0 1600x1200x24" \
            uv run pytest \
              --fx-executable="$FX_EXECUTABLE" \
              --geckodriver=geckodriver \
              "${tests[@]}" || exit_code=$?

          mkdir -p test-artifacts/headed

          if [[ -d artifacts ]]; then
            cp -R artifacts/. test-artifacts/headed/ || true
          fi

          exit "$exit_code"

      - name: Collect Xvfb logs
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        run: |
          # xvfb-run tears down its own server when pytest exits, so there is
          # nothing to kill here -- only the per-phase server logs to keep.
          mkdir -p test-artifacts/xvfb

          cp "$XVFB_LOG_DIR"/*.log test-artifacts/xvfb/ 2>/dev/null || true

      - name: Upload Linux artifacts
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: linux-${{ matrix.test_set }}-${{ github.run_id }}
          path: test-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Set Linux job result
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        env:
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          HEADLESS_RESULT: ${{ steps.headless.outcome }}
          HEADED_RESULT: ${{ steps.headed.outcome }}
        run: |
          echo "Version check: $VERIFY_RESULT"
          echo "Headless: $HEADLESS_RESULT"
          echo "Headed: $HEADED_RESULT"

          failures=()

          for phase in VERIFY_RESULT HEADLESS_RESULT HEADED_RESULT; do
            value="${!phase}"
            # 'skipped' is expected for the headed phase on the Glean entry.
            if [[ -n "$value" && "$value" != "success" && "$value" != "skipped" ]]; then
              failures+=("$phase")
            fi
          done

          if [[ "${#failures[@]}" -gt 0 ]]; then
            echo "::error::Failed phases on $STARFOX_SPLIT: ${failures[*]}"
            exit 1
          fi

  Report:
    name: Report
    needs:
      - Preflight
      - Test-Windows
      - Test-MacOS
      - Test-Linux
    if: ${{ !cancelled() && needs.Preflight.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Summarise results
        env:
          WINDOWS_RESULT: ${{ needs.Test-Windows.result }}
          MACOS_RESULT: ${{ needs.Test-MacOS.result }}
          LINUX_RESULT: ${{ needs.Test-Linux.result }}
        run: |
          {
            echo "### ${GITHUB_WORKFLOW} results"
            echo
            echo "| platform | result |"
            echo "|---|---|"
            echo "| Windows | \`$WINDOWS_RESULT\` |"
            echo "| macOS | \`$MACOS_RESULT\` |"
            echo "| Linux | \`$LINUX_RESULT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$WINDOWS_RESULT" "$MACOS_RESULT" "$LINUX_RESULT"; do
            if [[ -n "$result" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::At least one platform did not pass."
              exit 1
            fi
          done
