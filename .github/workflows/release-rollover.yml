name: Archive beta and promote nightly

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the rollover without changing branches
        type: boolean
        default: true
      release_version:
        description: Optional major version for recovery (for example, 159)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: firefox-release-rollover
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Use the existing DTE push bot's GitHub App credentials.
      - name: Create DTE push bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Check out automation from nightly
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: nightly
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check release schedule and roll over branches
        env:
          FIRST_RELEASE_VERSION: ${{ vars.FIRST_RELEASE_VERSION }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: python scripts/release_rollover.py
