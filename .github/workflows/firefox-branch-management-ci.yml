name: Validate Firefox branch management

on:
  pull_request:
    paths:
      - ".github/workflows/firefox-branch-management-ci.yml"
      - ".github/workflows/nightly-tests.yml"
      - ".github/workflows/resolve-firefox-branch.yml"
      - ".github/workflows/sync-firefox-branches.yml"
      - "scripts/collect_executables.py"
      - "scripts/firefox_branches.py"
      - "scripts/firefox_train.py"
      - "scripts/tests_firefox_train.py"
  push:
    branches:
      - main
      - nightly
    paths:
      - ".github/workflows/firefox-branch-management-ci.yml"
      - ".github/workflows/nightly-tests.yml"
      - ".github/workflows/resolve-firefox-branch.yml"
      - ".github/workflows/sync-firefox-branches.yml"
      - "scripts/collect_executables.py"
      - "scripts/firefox_branches.py"
      - "scripts/firefox_train.py"
      - "scripts/tests_firefox_train.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Unit-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Setup dependencies
        run: bash ./scripts/setup_python.sh

      - name: Test Firefox train management
        run: uv run python -m unittest scripts.tests_firefox_train

      - name: Lint Firefox train management
        run: |
          uv run ruff check \
            scripts/collect_executables.py \
            scripts/firefox_branches.py \
            scripts/firefox_train.py \
            scripts/tests_firefox_train.py
          uv run ruff format --check \
            scripts/collect_executables.py \
            scripts/firefox_branches.py \
            scripts/firefox_train.py \
            scripts/tests_firefox_train.py
