name: Claude Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-code-review:
    if: |
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')

    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@73367208d0bc0c529b8b3fb223cbd4a8f63586e4 # 1.0.133 2026-03-02
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations
            - Departures from CLAUDE.md, including its comment rules

            Note: The PR branch is already checked out in the current working directory.

            Note: Please make feedback concise and brief.

            This runs on every push. First read what has already been posted:
            `gh pr view ${{ github.event.pull_request.number }} --comments` and
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`.
            Don't repeat a finding that is already there, fixed or not.

            - Post each new finding once, inline with `mcp__github_inline_comment__create_inline_comment`,
              in one to three sentences. Add a `suggestion` block when the fix is small.
            - Use `gh pr comment` only for new findings that don't fit inline. No PR summary,
              no praise, no restating the inline comments.
            - Skip "worth noting" remarks and anything the PR description already acknowledges.
            - If there is nothing new, post nothing.

            Only post GitHub comments - don't submit review text as messages.

          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Read,Grep,Glob"'
